# Our own chart (unlike open5gs/ueransim, there's no third-party chart
# for this), so all of this is a plain Deployment + Service + a plain
# (non-IRSA) ServiceAccount. See README.md for the install command.

image:
  # Set at install time to the ECR repo URL from the
  # `ecr_repository_urls` Terraform output (the "aegis-mvp/aegis-gate"
  # key) - left empty here on purpose, there's no sane default across
  # AWS accounts.
  repository: ""
  tag: "v1" # IMMUTABLE tags per ecr.tf - never ":latest"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8501 # matches the Dockerfile's EXPOSE / streamlit --server.port

serviceAccount:
  name: aegis-gate-sa
  # Deliberately NO eks.amazonaws.com/role-arn annotation - this pod is
  # the public-facing Streamlit dashboard, which doesn't touch S3 at all
  # (it fits its baselines against the image's baked-in
  # data/aegis_traffic.csv). The real-traffic S3 scoring path
  # (src/score_real_traffic_from_s3.py) runs as its own separate image
  # and ServiceAccount (infra/docker/aegis-gate-scorer/,
  # infra/k8s/aegis-gate-scoring-cronjob.yaml) specifically so this pod
  # never holds standing AWS credentials it has no code path to use -
  # reviewed finding: IRSA grants travel with the ServiceAccount
  # annotation regardless of what's installed in the image, so an
  # annotation here would hand any RCE in this public-facing app a
  # working path to the data bucket even without boto3 present.

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
