# Synthetic test subscriber for the demo UE — matches the exact
# IMSI/K/OP already used and documented in the local Docker Compose
# setup (docs/GATE-3/real-traffic-capture.md), kept consistent rather
# than introducing a second set of test values.
#
# These are synthetic test vectors, never real SIM data — same
# requirement the HLD states explicitly ("Synthetic subscriber K/OP
# in a namespaced Kubernetes Secret, never real SIM data").
#
# Apply with: kubectl apply -f subscriber-secret.yaml
# Then build the two Helm --set flags that need these values (see
# infra/helm/open5gs/README.md and infra/helm/ueransim/README.md):
#
#   IMSI=$(kubectl -n open5gs get secret aegis-subscriber -o jsonpath='{.data.imsi}' | base64 -d)
#   K=$(kubectl -n open5gs get secret aegis-subscriber -o jsonpath='{.data.k}' | base64 -d)
#   OP=$(kubectl -n open5gs get secret aegis-subscriber -o jsonpath='{.data.op}' | base64 -d)
#
# Kept as a Secret (not inline in values.yaml) specifically so the
# actual K/OP never sits in plain text in a committed Helm values
# file — the indirection matters more than these particular test
# vectors' sensitivity, since the same pattern is what you'd want if
# these were ever swapped for anything less public.
apiVersion: v1
kind: Secret
metadata:
  name: aegis-subscriber
  namespace: open5gs
type: Opaque
stringData:
  imsi: "001011234567895"
  # MSIN — the IMSI with the mcc(001)+mnc(01) prefix stripped off.
  # The ueransim-ues chart's `initialMSISDN` field actually wants this,
  # NOT the full IMSI and NOT the phone-number-shaped msisdn below —
  # it builds the UE's full supi as imsi-{mcc}{mnc}{initialMSISDN}.
  # Confirmed by rendering the chart with the full IMSI passed in by
  # mistake: it produced the garbled supi "imsi-00101001011234567895"
  # (mcc+mnc+the-whole-IMSI-again) instead of the correct
  # "imsi-001011234567895" — caught before it ever reached a cluster.
  msin: "1234567895"
  k: "8baf473f2f8fd09487cccbd7097c6862"
  op: "11111111111111111111111111111111"
  msisdn: "9076543210"
